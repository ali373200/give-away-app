[project]
name = "give-away-app"
version = "0.1.0"
description = "Give Away - Vehicle QR Code Communication App"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "qrcode[pil]>=7.4.0",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
